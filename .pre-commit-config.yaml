repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        args:
          - --pretty
          - --show-error-codes
          - --show-error-context
          - --explicit-package-bases
          - --ignore-missing-imports
          - custom_components/surepcha
        files: ^custom_components/surepcha/.*\.py$
        # Single whole-package invocation: per-file invocations race on the shared
        # .mypy_cache sqlite store and intermittently corrupt it.
        pass_filenames: false
