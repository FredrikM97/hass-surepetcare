[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-surepetcare"
version = "0.0.0"
description = "Hass component library for SurePetcare API"
authors = [
    { name = "FredrikM97" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "attrs==26.1.0",
    "homeassistant==2026.9.4",
    "py-surepetcare==0.6.4",
    "pre-commit==4.6.2",
    "probatio==0.11.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "syrupy==5.2.0",
    "voluptuous==0.16.0",
]

[tool.setuptools.packages.find]
include = ["custom_components.surepcha*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
