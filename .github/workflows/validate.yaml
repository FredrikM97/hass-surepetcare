name: Validate

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: "ubuntu-latest"
    if: github.repository == 'FredrikM97/hass-surepetcare' && github.repository_owner == 'FredrikM97'
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@master"

  hacs:
    runs-on: "ubuntu-latest"
    if: github.repository == 'FredrikM97/hass-surepetcare' && github.repository_owner == 'FredrikM97'
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
