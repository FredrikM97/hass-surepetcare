name: Release

# Two independent jobs, gated by trigger/action so only one ever runs:
#   - update_draft: push to main (direct or via merged PR), or manual dispatch
#                   with action=update_draft (default) -> refresh rolling draft
#   - publish:      manual dispatch with action=publish -> cut a real release
# The changelog is computed from actual commit messages (Conventional Commits)
# since the last vX.Y.Z tag, not from PR titles/labels, so it works the same
# whether commits land via a PR merge or a direct push.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        default: update_draft
        options:
          - update_draft
          - publish
      bump:
        description: 'Version bump to release (only used for publish)'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

env:
  COMPONENT_NAME: surepcha

permissions:
  contents: write

jobs:
  update_draft:
    if: |
      github.repository == 'FredrikM97/hass-surepetcare' && github.repository_owner == 'FredrikM97' &&
      (github.event_name == 'push' || github.event.inputs.action == 'update_draft')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          RANGE="HEAD"
          [ -n "$LAST_TAG" ] && RANGE="$LAST_TAG..HEAD"

          CHANGELOG=""
          CHORES=""

          while IFS=$'\x1f' read -r hash subject; do
            [ -z "$subject" ] && continue

            LOGIN=$(gh api "repos/${{ github.repository }}/commits/$hash" --jq '.author.login // empty' 2>/dev/null || true)
            author="@${LOGIN:-$(git log -1 --format='%an' "$hash")}"

            if echo "$subject" | grep -qiE '^deps(\([^)]*\))?!?:'; then
              # Dependabot commits (deps(package), deps(workflow)) go to Maintenance
              DESC=$(echo "$subject" | sed -E 's/^deps(\([^)]*\))?!?:[[:space:]]*//I')
              CHORES="${CHORES}- ${DESC} (${author})"$'\n'
            else
              CHANGELOG="${CHANGELOG}- ${subject} (${author})"$'\n'
            fi
          done <<< "$(git log $RANGE --no-merges --pretty=format:'%H%x1f%s')"

          : > release-notes.md
          [ -n "$CHANGELOG" ] && { echo "## Changelog"; printf '%s' "$CHANGELOG"; echo; } >> release-notes.md
          [ -n "$CHORES" ] && { echo "## Maintenance"; printf '%s' "$CHORES"; echo; } >> release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "## Changes" >> release-notes.md
            echo "- No changes" >> release-notes.md
          fi
          echo >> release-notes.md

          if [ -n "$LAST_TAG" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${LAST_TAG}...main"
          else
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/main"
          fi
          echo "---" >> release-notes.md
          echo "**Full Changelog**: $COMPARE_URL" >> release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling draft release
        run: |
          if gh release view unreleased >/dev/null 2>&1; then
            gh release edit unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          else
            gh release create unreleased \
              --title "Unreleased" \
              --notes-file release-notes.md \
              --target main \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: |
      github.repository == 'FredrikM97/hass-surepetcare' && github.repository_owner == 'FredrikM97' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require an existing draft to publish
        run: |
          if ! gh release view unreleased >/dev/null 2>&1; then
            echo "::error::No draft release found to publish. Push to main first to prepare one."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: notes
        run: |
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          BASE="${LAST_TAG#v}"
          BASE="${BASE:-0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *) PATCH=$((PATCH + 1)) ;;
          esac
          TAG="v$MAJOR.$MINOR.$PATCH"

          gh release view unreleased --json body -q .body > release-notes.md
          # Draft compared against main since it wasn't tagged yet; swap in the real tag now
          sed -i "s#/compare/\(.*\)\.\.\.main#/compare/\1...${TAG}#; s#/commits/main#/commits/${TAG}#" release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build component package
        run: |
          version="${{ steps.notes.outputs.tag }}"
          yq e -P -o=json \
            -i ".version = \"${version#v}\"" \
            "${{ github.workspace }}/custom_components/${{ env.COMPONENT_NAME }}/manifest.json"

          cd "${{ github.workspace }}/custom_components/${{ env.COMPONENT_NAME }}"
          zip "${{ env.COMPONENT_NAME }}.zip" -r ./

      - name: Publish release
        run: |
          gh release edit unreleased \
            --tag "${{ steps.notes.outputs.tag }}" \
            --title "${{ steps.notes.outputs.tag }}" \
            --notes-file release-notes.md \
            --target main \
            --draft=false \
            --latest
          gh release upload "${{ steps.notes.outputs.tag }}" \
            "${{ github.workspace }}/custom_components/${{ env.COMPONENT_NAME }}/${{ env.COMPONENT_NAME }}.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
